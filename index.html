<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Brownies</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #687078 0%, #30353a 45%, #111315 100%);
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: auto;
      padding: 24px 18px 45px;
      text-align: center;
    }

    .hero {
      width: 100%;
      display: block;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.5);
    }

    .intro {
      margin: 28px 0 24px;
      font-family: "Cormorant Garamond", Didot, Georgia, serif;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: 2px;
    }

    .divider {
      width: 55px;
      height: 2px;
      margin: 0 auto 28px;
      background-color: #ff2b2b;
    }

    .links {
      display: grid;
      gap: 16px;
    }

    .button {
      display: block;
      padding: 18px 22px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-left: 5px solid #ff2b2b;
      background-color: rgba(12, 14, 16, 0.82);
      color: #ffffff;
      text-decoration: none;
      font-family: "Cormorant Garamond", Didot, Georgia, serif;
      font-size: 24px;
      letter-spacing: 1px;
      transition: 0.2s ease;
    }

    .button:hover,
    .button:focus {
      background-color: #ffffff;
      color: #17191b;
      transform: translateY(-2px);
    }

    .contact {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
    }

    .contact h2 {
      margin: 0 0 18px;
      font-family: "Cormorant Garamond", Didot, Georgia, serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .contact a {
      display: block;
      margin: 12px 0;
      color: #ffffff;
      font-size: 17px;
      text-decoration: none;
    }

    .contact a:hover,
    .contact a:focus {
      color: #ff5a5a;
      text-decoration: underline;
    }

    footer {
      margin-top: 32px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 500px) {
      .page {
        padding: 14px 12px 32px;
      }

      .intro {
        font-size: 21px;
      }

      .button {
        padding: 16px;
        font-size: 22px;
      }

      .contact a {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <img
      class="hero"
      src="Brownies-logo.png"
      alt="The Brownies en concert"
    >

    <p class="intro">Découvrez notre univers</p>
    <div class="divider"></div>

    <nav class="links" aria-label="Liens du groupe">

      <a
        class="button"
        href="https://canva.link/yrjwyg4lddmufnj"
        target="_blank"
        rel="noopener noreferrer"
      >
        Notre bio
      </a>

      <a
        class="button"
        href="https://www.youtube.com/watch?v=7tbPFakJV-g"
        target="_blank"
        rel="noopener noreferrer"
      >
        Nos extraits live
      </a>

      <a
        class="button"
        href="https://www.facebook.com/lesbrowniess"
        target="_blank"
        rel="noopener noreferrer"
      >
        Notre page Facebook
      </a>
      <a
        class="button"
        href="https://docs.google.com/forms/d/e/1FAIpQLScNgWg_UXrclhMGitAPKWdN9tqURYQmsAsVMN2Wr0yVlfel6g/viewform?usp=dialog"
        target="_blank"
        rel="noopener noreferrer"
      >
        Recevoir nos prochaines dates
      </a>
    </nav>

    <section class="contact">
      <h2>Nous contacter</h2>

      <a href="tel:+33610800733">
        06 10 80 07 33
      </a>

      <a href="mailto:lesbrowniesss@gmail.com">
        lesbrowniesss@gmail.com
      </a>
    </section>

    <footer>The Brownies · Pop Rock Live</footer>

  </main>
</body>
</html>
